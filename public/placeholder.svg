<svg width="600" height="600" viewBox="0 0 600 600" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.1" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="1" />
    </pattern>
  </defs>
  
  <rect width="600" height="600" fill="url(#bg)" />
  <rect width="600" height="600" fill="url(#grid)" />
  <circle cx="300" cy="300" r="180" fill="url(#glow)" filter="blur(40px)" />
  
  <!-- Modern Code/Question Graphic -->
  <g transform="translate(240, 240)">
    <circle cx="60" cy="60" r="50" stroke="#f97316" stroke-width="4" stroke-opacity="0.8" fill="rgba(249, 115, 22, 0.1)" />
    <path d="M50 48 C50 40 70 40 70 48 C70 56 60 58 60 68" stroke="#ffffff" stroke-width="4" stroke-linecap="round" fill="none" />
    <circle cx="60" cy="78" r="2.5" fill="#ffffff" />
  </g>
  
  <text x="300" y="380" text-anchor="middle" fill="#ffffff" fill-opacity="0.7" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="600" letter-spacing="1">RiverFlow</text>
  <text x="300" y="410" text-anchor="middle" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="14">Developer Q&amp;A</text>
</svg>
